  </button>
</header>

<main>
  <div id="notice" class="notice" hidden></div>
  <section class="view" id="view-now"></section>
  <section class="view" id="view-browse" hidden></section>
  <section class="view" id="view-explore" hidden></section>
  <section class="view" id="view-map" hidden></section>
  <section class="view" id="view-mine" hidden></section>
</main>

<button class="update-pill" id="updatePill" hidden>Schedule updated &middot; tap to refresh</button>

<button class="minibar" id="minibar" hidden></button>

<nav class="nav" aria-label="Sections">
  <button data-tab="now" aria-current="page">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now
  </button>
  <button data-tab="browse">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search
  </button>
  <button data-tab="explore">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Explore
  </button>
  <button data-tab="map">
    <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map
  </button>
  <button data-tab="mine" style="position:relative">
    <svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Mine
    <span class="badge" id="mineBadge" hidden>0</span>
  </button>
</nav>

<div id="sheetWrap" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle" id="sheet">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-panel" id="panel-settings">
    <h2 id="sheetTitle">Settings</h2>
    <label>Crowd factor for walk estimates: <b id="crowdLabel"></b>
      <input type="range" id="crowd" min="1" max="2.5" step="0.1">
    </label>
    <label class="toggle"><input type="checkbox" id="noiseDefault"> Hide photo sessions and video-room screenings by default</label>
    <label class="toggle"><input type="checkbox" id="bigText"> Larger text</label>
    <details class="advanced" id="advanced">
      <summary>Advanced</summary>
      <div class="advanced-body">
        <label>Preview a different time (leave blank to use the real clock)
          <input type="datetime-local" id="previewTime">
        </label>
        <div class="rowbtns">
          <button class="btn quiet" id="applyPreview">Apply preview time</button>
          <button class="btn quiet" id="clearPreview">Use real time</button>
        </div>
        <details>
          <summary style="color:var(--muted);cursor:pointer">Walk-time defaults (minutes, before crowd factor)</summary>
          <table class="walk-table" id="walkTable"></table>
        </details>
        <div class="device" id="deviceLine"></div>
      </div>
    </details>
    <div class="keep" id="keep" hidden></div>
    <div class="rowbtns">
      <button class="btn" id="closeSheet">Done</button>
    </div>
    <div class="rowbtns">
      <button class="btn danger" id="resetPicks">Remove all picks</button>
    </div>
    </div>
    <div class="sheet-panel" id="panel-event" hidden></div>
    <div class="sheet-panel" id="panel-hotel" hidden></div>
  </div>
</div>
