     (the next site); main publishes the source as it is and stays unmarked. -->
<meta name="dc-channel" content="next">

<!-- Link previews in chats, first in the head so every previewer finds them
     before it stops reading: a card with the mark beats a bare URL. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dragon Con 2026 planner">

<!-- Opaque, not translucent. On iOS 26 a translucent status bar gives the
     home-screen app a web view that starts under the status bar but is
     short by its height, leaving a dead strip at the bottom of the screen
     that nothing can draw into; the nav then floated a thumb above the
     home indicator on every tab. Opaque puts the web view below the bar
     and runs it to the bottom edge. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Dragon Con 2026 planner</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<!-- iOS does not accept SVG here; without a PNG the home-screen icon is a
     screenshot of the page. The PNGs come from make_icons.py. -->
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-title" content="DC26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   Tokens. Color is information here: each hotel has one hue, used on
   room chips and walk warnings. Gold is reserved for "mine".
   ------------------------------------------------------------------ */
:root {
  --ink: #171A33;
  --surface: #22264A;
  --raised: #2B3060;
  --line: #3A3F70;
  --text: #F3EFE4;
  --muted: #A5A9C9;
  --dim: #6F739A;
  --gold: #F3C64B;
  --gold-ink: #2A2200;
  --warn: #FF8A7A;
  --font: "Barlow Semi Condensed", "Avenir Next Condensed", "Roboto Condensed", system-ui, sans-serif;
  --h-Marriott: #F0705D;
  --h-Hyatt: #55B7DD;
  --h-Hilton: #79D19B;
  --h-Courtland: #C797F5;
  --h-Westin: #F5A63F;
  --h-Mart: #C6DC6B;   /* yellow-green: kept clear of --gold, which means "mine" */
  --h-Hardy: #9ED5C0;
  --h-Streaming: #8F97AE;
  --h-Other: #8F97AE;
  --park: #3FA34D;     /* Hardy Ivy Park on the map: a green that is not the Hilton's */
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);        /* the status bar, on phones that draw under it */
}
* { box-sizing: border-box; }
/* No overscroll stretch. Android 12+ stretches the whole page layer when you
   scroll past the end, fixed nav included, so the bar bounced on every long
   list. This also drops pull-to-refresh, which the update pill covers. */
html { background: var(--ink); color-scheme: dark; overscroll-behavior-y: none; }
/* Larger text (Settings): text sizes are in rem so this one number scales
   them all; boxes stay in px and were checked at 375px wide with it on. */
html.bigtext { font-size: 115%; }
/* The page itself never scrolls; main does, below. When the page is the
   scroller, iOS moves the bottom safe-area inset as it scrolls and
   rubber-bands the whole layer, and a fixed nav padded by that inset goes
   along for the ride. A scroller of our own keeps the header and nav where
   they are on every tab. */
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; font-family: var(--font); font-size: 1.0625rem; line-height: 1.3;
  color: var(--text); background: var(--ink);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Header ------------------------------------------------------------ */
.hdr {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  background: var(--ink); border-bottom: 1px solid var(--line);
  padding: calc(10px + var(--safe-top)) max(14px, calc(50% - 366px)) 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
/* One line: clock, count, freshness. The brand is a small label above it,
   on the Now tab only; everywhere else the line is the whole header. */
.hdr .hdr-text { flex: 1; min-width: 0; }
.hdr .brand { font-size: .75rem; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.hdr .hdr-line { font-size: clamp(.8125rem, 4vw, .9375rem); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .fresh { color: var(--muted); }
/* When the line is still too long - a preview clock, a narrow phone - the
   word "refreshed" goes before anything is clipped. Measured, not guessed. */
.hdr .hdr-line.tight .word { display: none; }
.hdr .hdr-line.tighter { font-size: .8125rem; }   /* and if that is not enough, a size down */
/* Only there while a ?now= override is on; a tap goes back to the real clock. */
.sim-chip { display: inline-block; vertical-align: 1px; margin-left: 8px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--gold); background: transparent; color: var(--gold); font: inherit; font-size: .6875rem; font-weight: 600; line-height: 1.6; cursor: pointer; }
.sim-chip span { opacity: .7; }
.icon-btn {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted);
}
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Notices ------------------------------------------------------------ */
.notice {
  margin: 12px 14px 0; padding: 10px 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: .9375rem;
}
.notice b { color: var(--text); font-weight: 600; }
.device { font-size: .75rem; color: var(--dim); line-height: 1.4; }
.notice.warn { border-color: var(--warn); color: var(--text); }
.pick-news ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.pick-news .btn { margin-top: 12px; height: 38px; }
.nudge .btns, .notice.archive .btns { display: flex; gap: 8px; margin-top: 12px; }
.nudge .btn, .notice.archive .btn { height: 38px; }

/* Views -------------------------------------------------------------- */
main {
  position: fixed; top: 0; bottom: 0; left: 0; right: 0; max-width: 760px; margin: 0 auto;
  overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch;
}
/* Room for the header above and the nav below, as content rather than
   padding: a scroll container's top padding shifts where sticky children
   measure from, and Safari has not always scrolled its end padding. */
main::before { content: ""; display: block; height: var(--hdr-h, 82px); }
main::after { content: ""; display: block; height: calc(76px + var(--safe-bottom)); }
body.has-minibar main::after { height: calc(124px + var(--safe-bottom)); }
.view { padding: 0 0 12px; }
.section-title {
  padding: 18px 14px 6px; font-size: .9375rem; color: var(--muted); font-weight: 600;
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
}
.section-title .count { font-weight: 400; color: var(--dim); font-variant-numeric: tabular-nums; }

/* Map ------------------------------------------------------------------
   A schematic of the con hotels. Blocks wear their room-chip hue as an
   opaque tint, so the route and the streets pass under them rather than
   through their labels; the park is the one green that is not a hotel. */
/* The Map tab is a column between header and nav: the chip strip, the map,
   the card. Width first: the SVG takes the content width and its height
   follows from the frame. Only when header, chips, map, card and nav would
   not fit the viewport does it shrink to fit, centred, down to a floor
   below which the tab scrolls with the chips pinned. The mini-bar never
   shows on this tab. */
#view-map { display: flex; flex-direction: column; height: calc(100dvh - var(--hdr-h, 63px) - 76px - var(--safe-bottom)); }
#view-map .controls-sticky { flex: none; }
.map-wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding: 12px 14px 0; }
.map { display: block; width: 100%; height: auto; flex: 0 1 auto; min-height: 200px; }
.map-under { flex: none; }
.map-ground { fill: var(--surface); }
.map-street { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.map-street.faint { stroke-width: 2; opacity: .55; }
.map-street-label { font-family: var(--font); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; fill: var(--dim); }
.map-bridge { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 4; stroke-linecap: round; }
.map-hotel rect { fill: color-mix(in srgb, var(--h) 18%, var(--surface)); stroke: var(--h); stroke-width: 1.5; }
.map-hotel text { font-family: var(--font); font-size: 11px; font-weight: 600; letter-spacing: .06em; fill: var(--h); text-anchor: middle; dominant-baseline: central; }
.map-park rect { fill: color-mix(in srgb, var(--h) 12%, var(--surface)); }
.map-park text { font-size: 9px; }
.map-hotel text.long { font-size: 9.5px; letter-spacing: .04em; }   /* COURTLAND measures 60 px at 11px; the block is 60 */
.map-hotel, .map-pill { cursor: pointer; }
.map-hotel:focus-visible rect { stroke-width: 3; }
.map-pill rect { fill: var(--gold); }
.map-pill text { font-family: var(--font); font-size: 11px; font-weight: 700; fill: var(--gold-ink); text-anchor: middle; dominant-baseline: central; }
.map-ring { fill: none; stroke: var(--gold); stroke-width: 2.5; pointer-events: none; }
.map-ring.next { stroke-width: 2; animation: map-pulse 1.6s ease-in-out infinite; }
@keyframes map-pulse { 0%, 100% { stroke-opacity: 1; stroke-width: 2; } 50% { stroke-opacity: .35; stroke-width: 4; } }
@media (prefers-reduced-motion: reduce) { .map-ring.next { animation: none; } }
/* The card under the map: the next pick, as the hero sees it. Tappable like
   the hero, and so is the On now line above it. */
.next-on { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 2px 0; font: inherit; font-size: .875rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.next-on b { color: var(--text); font-weight: 600; }
.next-card { display: block; width: 100%; text-align: left; margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--text); font: inherit; cursor: pointer; }
.next-card .nc-label { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.next-card .nc-title { font-size: 1.125rem; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.next-card .nc-where { margin-top: 4px; font-size: .875rem; font-weight: 700; color: var(--h); }
.next-card .nc-when { margin-top: 4px; font-size: .9375rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.next-card .nc-when.leave { color: var(--gold); }
.next-card .nc-when.late { color: var(--warn); }
.next-card .nc-walk { margin-top: 2px; font-size: .8125rem; color: var(--muted); }
.next-card.empty { color: var(--muted); font-size: .9375rem; cursor: default; }
.map-offmap { padding-top: 6px; font-size: .875rem; color: var(--muted); }

/* Controls ----------------------------------------------------------- */
.controls { padding: 12px 14px 0; display: grid; gap: 10px; }
.search.indexing::placeholder { color: var(--dim); font-style: italic; }
.search {
  width: 100%; height: 48px; padding: 0 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
}
.search::placeholder { color: var(--dim); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
/* The search box and the day row follow you down a long list - those are the
   two you reach for mid-scroll. The rest scroll away; sticking everything
   would leave no room for results on a phone. */
.controls-sticky {
  position: sticky; top: var(--hdr-h, 74px); z-index: 4;
  background: var(--ink); border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
.controls-rest { padding-top: 10px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; height: 38px; padding: 0 13px; border-radius: 19px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-weight: 500; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--ink); border-color: var(--text); font-weight: 600; }
.chip.hotel[aria-pressed="true"] { background: var(--h); border-color: var(--h); color: var(--ink); }
.suggest-row { align-items: center; padding-top: 2px; }
.suggest-label { flex: none; font-size: .75rem; color: var(--dim); letter-spacing: .04em; text-transform: uppercase; padding-right: 2px; }
.chip.suggest { font-weight: 600; }
.chip.suggest .n { color: var(--dim); font-weight: 700; margin-left: 4px; font-size: .75rem; }
/* Not gold - gold means "mine". A quiet outline that reads as a label. */
.celeb {
  display: inline-block; font-size: .6875rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--h-Hyatt); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; line-height: 17px;
}
.chip.suggest.on { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 700; }
.chip.suggest.on span { opacity: .65; }
.divider {
  padding: 10px 14px 8px; font-size: .8125rem; font-weight: 700; color: var(--muted);
  background: var(--ink); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  letter-spacing: .03em;
}
.divider.fold { padding: 0; }
.divider.fold button {
  width: 100%; text-align: left; padding: 10px 14px 8px; background: none; border: 0;
  font: inherit; font-weight: 700; color: var(--muted); cursor: pointer;
}
/* Explore ------------------------------------------------------------ */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 0 14px 6px; }
.tile {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px;
  padding: 9px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  color: var(--text); font: inherit; text-align: left; cursor: pointer;
}
.tile.on { border-color: var(--gold); }
.tile-name { font-size: .875rem; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.tile-meta { flex: none; display: flex; align-items: center; gap: 5px; font-size: .8125rem; font-weight: 700; color: var(--dim); }
.tile-mark { color: var(--gold); font-size: .6875rem; }
.follow-chips { align-items: center; }
.follow-chip {
  flex: none; display: inline-flex; align-items: stretch; border: 1px solid var(--gold);
  border-radius: 999px; overflow: hidden; background: transparent;
}
.follow-chip .fc-name {
  background: none; border: 0; padding: 7px 4px 7px 12px; font: inherit; font-size: .875rem; font-weight: 700;
  color: var(--gold); cursor: pointer; white-space: nowrap;
}
.follow-chip .fc-x {
  background: none; border: 0; padding: 7px 10px 7px 4px; font: inherit; font-size: 1rem; line-height: 1;
  color: var(--gold); opacity: .7; cursor: pointer;
}
.chip.fc-add { flex: none; }
.explore-jump .n { color: var(--dim); font-weight: 700; margin-left: 4px; font-size: .75rem; }
.explore-jump .chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
/* Following sits above the tiles, behind a fold: a long feed would push the
   grid off screen for someone who came to wander. */
.following { border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.suggested { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.fol-head {
  width: 100%; display: flex; align-items: baseline; gap: 6px; padding: 14px 14px 4px;
  background: none; border: 0; color: var(--text); font: inherit; font-size: 1.0625rem; font-weight: 700;
  text-align: left; cursor: pointer;
}
.fol-head .count { font-weight: 400; color: var(--dim); font-variant-numeric: tabular-nums; }
.fol-head .caret { margin-left: auto; color: var(--dim); font-size: .9375rem; }
.hint { padding: 0 14px 8px; font-size: .875rem; color: var(--muted); }
.flabel {
  font-size: .6875rem; font-weight: 700; color: var(--gold); border: 1px solid var(--gold);
  border-radius: 999px; padding: 0 6px; line-height: 17px; opacity: .85;
}
.explore-head { padding: 10px 14px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 5px; justify-items: start; }
.explore-head .back { background: none; border: 0; padding: 0; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
.explore-head .eh-kind { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-top: 4px; }
.explore-head .eh-name { margin: 0; font-size: 1.375rem; line-height: 1.2; }
.explore-head .eh-count { font-size: .875rem; color: var(--muted); }
.follow-btn { margin-top: 6px; }
.follow-btn.on { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
.ev-people .who { white-space: nowrap; }
.see-all {
  background: none; border: 0; padding: 0 0 0 2px; font: inherit; font-size: .8125rem; font-weight: 700;
  color: var(--gold); text-decoration: underline; cursor: pointer;
}
.no-exact {
  padding: 9px 14px; font-size: .8125rem; color: var(--muted);
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.no-exact b { color: var(--text); }
.hidden-note { padding: 10px 14px; font-size: .875rem; color: var(--muted); }
.hidden-note button { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--gold); text-decoration: underline; cursor: pointer; }
.parsed-chips { padding-top: 2px; }
.chip.parsed { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 700; }
.chip.parsed span { opacity: .65; margin-left: 2px; }
.row-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { height: 40px; padding: 0 12px; background: var(--surface); color: var(--muted); border: 0; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); font-weight: 600; }
select.track {
  flex: 1 1 160px; min-width: 0; height: 40px; padding: 0 10px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
}
.toggle { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .9375rem; min-height: 40px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--gold); margin: 0; }

/* Rows: a departures board. Time is loudest; the room chip carries the hotel color. */
.list { list-style: none; margin: 0; padding: 0; }
.day-head { padding: 22px 14px 4px; font-size: 1.25rem; font-weight: 700; }
.time-head { padding: 12px 14px 2px; font-size: .8125rem; color: var(--dim); font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); }
.row { border-top: 1px solid var(--line); }
.row.open { background: var(--surface); }
.row.mine .title::before { content: "★ "; color: var(--gold); }
.row.cancelled .title { text-decoration: line-through; color: var(--muted); }
/* A strike-through alone reads as a rendering glitch; say the word. */
.cancelled-tag {
  display: inline-block; font-size: .6875rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--warn); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; line-height: 17px;
}
.row-main {
  width: 100%; display: grid; grid-template-columns: 66px 1fr; gap: 10px; text-align: left;
  background: none; border: 0; padding: 11px 0 11px 14px; align-items: start;
}
.row-line { display: grid; grid-template-columns: 1fr 56px; align-items: stretch; }
.t { font-variant-numeric: tabular-nums; line-height: 1.05; padding-top: 1px; }
.t .start { font-size: 1.25rem; font-weight: 700; display: block; }
.t .ampm { font-size: .6875rem; font-weight: 600; color: var(--muted); margin-left: 2px; }
.t .end { display: block; font-size: .8125rem; color: var(--dim); margin-top: 3px; }
.body { min-width: 0; }
.title { font-size: 1.125rem; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: .875rem; color: var(--muted); }
/* "Hilton · 313-314" as a chip. The hotel part never shortens; a long room
   takes the ellipsis. */
.room {
  display: inline-flex; align-items: baseline; gap: 5px; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: .8125rem;
  background: color-mix(in srgb, var(--h) 18%, transparent); color: var(--h); border: 1px solid color-mix(in srgb, var(--h) 45%, transparent);
  max-width: 100%; min-width: 0; white-space: nowrap;
}
.room .rh { flex: none; }
.room .rr { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.track { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.status { color: var(--gold); font-weight: 600; }
mark { background: none; color: var(--gold); font-weight: 700; }
.t .day { display: block; font-size: .6875rem; font-weight: 600; color: var(--muted); margin-bottom: 1px; letter-spacing: .02em; }
.snippet { margin-top: 5px; font-size: .875rem; color: var(--muted); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tagline { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .8125rem; padding: 2px 8px; border-radius: 6px; background: var(--raised); border: 1px solid var(--line); color: var(--text); }
.tag.adult { color: var(--warn); }
.star {
  background: none; border: 0; color: var(--dim); font-size: 1.625rem; line-height: 1; display: grid; place-items: center; padding: 0 8px 0 0;
}
.star[aria-pressed="true"] { color: var(--gold); }
.btn {
  height: 46px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 1rem;
  background: var(--gold); color: var(--gold-ink); border: 0;
}
.btn.quiet { background: var(--raised); color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--warn); border: 1px solid var(--line); }
.gap {
  margin: 0 14px 0 80px; padding: 6px 10px; font-size: .875rem; border-left: 3px solid var(--line); color: var(--muted);
}
.gap.tight { border-color: var(--warn); color: var(--text); }
.gap.overlap { border-color: var(--warn); color: var(--warn); font-weight: 600; }
.empty { padding: 28px 14px; color: var(--muted); font-size: 1rem; }
.empty b { color: var(--text); }
.more { margin: 14px; }
/* Two rows of two on one grid: the actions take the view toggle's footprint,
   so the top of Mine reads as one control strip rather than a stack of odd
   shapes. Export keeps its gold fill; it is the one you came here for. */
.mine-actions { padding: 12px 14px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mine-actions .btn { height: 40px; padding: 0 12px; border-radius: 10px; font-size: .9375rem; font-weight: 700; }
.btn[disabled] { opacity: .45; }

/* Bottom nav -------------------------------------------------------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--ink); border-top: 1px solid var(--line);
  padding: 6px max(8px, calc(50% - 372px)) calc(6px + var(--safe-bottom));
}
.nav button {
  height: 58px; border: 0; background: none; color: var(--dim); border-radius: 12px;
  display: grid; place-items: center; gap: 2px; font-weight: 600; font-size: .875rem;
  white-space: nowrap; padding: 0 2px; min-width: 0;
}
.nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--text); background: var(--surface); }
.nav .badge { position: absolute; margin-left: 40px; margin-top: -34px; background: var(--gold); color: var(--gold-ink); border-radius: 10px; font-size: .75rem; padding: 1px 6px; font-weight: 700; }

/* Settings sheet ---------------------------------------------------- */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 9; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-width: 760px; margin: 0 auto;
  background: var(--surface); border-radius: 18px 18px 0 0; border: 1px solid var(--line); border-bottom: 0;
  padding: 16px 16px calc(20px + var(--safe-bottom)); display: grid; gap: 16px;
  /* Claim the vertical gesture. Without this the browser scrolls the page
     behind the sheet while you're dragging it, and both move at once. */
  touch-action: none;
  will-change: transform;
}
/* The description is the one part that should still scroll under a finger. */
.ev-body { touch-action: pan-y; }
/* Only while settling - during a drag the sheet must track the finger exactly. */
.sheet.settling { transition: transform .22s cubic-bezier(.2, .7, .3, 1); }
.sheet-back { transition: opacity .22s linear; }
.sheet-back.dragging { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .sheet.settling { transition: none; }
  .sheet-back { transition: none; }
}
.sheet h2 { margin: 0; font-size: 1.25rem; }
.sheet label { display: grid; gap: 6px; color: var(--muted); font-size: .9375rem; }
.sheet input[type="range"] { width: 100%; accent-color: var(--gold); }
.sheet input[type="datetime-local"] { height: 44px; padding: 0 10px; border-radius: 10px; background: var(--ink); border: 1px solid var(--line); color: var(--text); }
.sheet .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; }
/* Settings: the two everyday controls up top; the rest folds under
   Advanced, which scrolls on its own inside the sheet. Remove all picks
   is last and on its own, away from Done. */
.advanced > summary { color: var(--muted); cursor: pointer; font-size: .9375rem; font-weight: 600; padding: 4px 0; }
.advanced-body { display: grid; gap: 16px; padding-top: 12px; max-height: 45vh; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.walk-table { font-size: .875rem; color: var(--muted); }
.walk-table td { padding: 2px 6px 2px 0; }

/* Bottom sheet: one wrapper, three panels (settings, event, hotel) */
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: -4px auto 0; flex: none; }
.sheet-panel { display: grid; gap: 16px; }
.sheet-panel[hidden] { display: none; }
.ev-head { display: grid; gap: 6px; }
.ev-head h2 { margin: 0; font-size: 1.3125rem; line-height: 1.25; }
.ev-when { color: var(--muted); font-size: .9375rem; }
.ev-room { font-size: 1.1875rem; font-weight: 700; color: var(--h); line-height: 1.2; }
.ev-body { display: grid; gap: 12px; max-height: 48vh; overflow-y: auto; overscroll-behavior: contain; }
.ev-body p { margin: 0; white-space: pre-line; font-size: 1rem; }
.ev-people { color: var(--muted); font-size: .9375rem; }
.ev-people span { color: var(--text); }
.ev-actions { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.ev-actions .btn { flex: 1 1 auto; }
.ev-star {
  font-size: 1.5rem; line-height: 1; width: 56px; flex: none; cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 12px; color: var(--muted);
}
.ev-star[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }

/* Hero card: the next thing you have to act on */
.hero {
  display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
  padding: 14px; background: var(--surface); border: 0; border-bottom: 1px solid var(--line);
  color: var(--text); font: inherit; cursor: pointer;
}
.hero .ring { flex: none; position: relative; width: 62px; height: 62px; }
.hero .ring svg { transform: rotate(-90deg); display: block; }
.hero .ring .track-c { stroke: var(--line); }
.hero .ring .prog { stroke: var(--gold); transition: stroke-dashoffset .6s linear; }
.hero.late .ring .prog { stroke: var(--warn); }
.hero .ring .num {
  position: absolute; inset: 0; display: grid; place-items: center; line-height: 1;
  font-size: 1.0625rem; font-weight: 700; color: var(--gold);
}
.hero.late .ring .num { color: var(--warn); }
.hero .ring .num small { display: block; font-size: .625rem; font-weight: 600; color: var(--muted); }
.hero .hbody { display: grid; gap: 5px; min-width: 0; flex: 1; }
.hero .hkicker { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero .htitle { font-size: 1.1875rem; font-weight: 700; line-height: 1.2; }
.hero .hroom { font-size: .9375rem; font-weight: 700; color: var(--h); }
.hero .hleave { font-size: .9375rem; font-weight: 700; color: var(--gold); }
.hero.late .hleave { color: var(--warn); }
.hero .hthen { font-size: .8125rem; color: var(--muted); }
.hero .hthen b { color: var(--text); font-weight: 700; }
.list.compact .row-main { padding-top: 8px; padding-bottom: 8px; }
.list.compact .snippet { display: none; }
@media (prefers-reduced-motion: reduce) { .hero .ring .prog { transition: none; } }

/* Sticky next-up bar: what's next while you're browsing something else */
.minibar {
  position: fixed; left: 0; right: 0; bottom: calc(70px + var(--safe-bottom)); z-index: 6;
  height: 48px; box-sizing: border-box; width: 100%; border: 0;
  padding: 0 max(14px, calc(50% - 366px)); font: inherit; color: var(--text); text-align: left;
  background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; cursor: pointer;
}
.minibar .mb-body { display: grid; gap: 1px; min-width: 0; flex: 1; }
.minibar .mb-title { font-size: .875rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.minibar .mb-room { font-size: .75rem; font-weight: 700; color: var(--h); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.minibar .mb-when { flex: none; font-size: .875rem; font-weight: 700; color: var(--gold); }
/* Sits above the nav and the next-up bar, never over the list you're reading. */
.update-pill {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 8;
  bottom: calc(80px + var(--safe-bottom));
  border: 0; border-radius: 999px; padding: 9px 16px; font: inherit; font-size: .875rem; font-weight: 700;
  background: var(--gold); color: var(--gold-ink); box-shadow: 0 4px 16px rgba(0,0,0,.45); cursor: pointer;
  touch-action: none;
}
body.has-minibar .update-pill { bottom: calc(132px + var(--safe-bottom)); }
.update-pill.settling { transition: transform .2s ease-out, opacity .2s ease-out; }
/* The dev-build mark: only on a build stamped with a channel (the next site).
   Above the nav, clear of the mini-bar, and it takes no taps. */
.devmark { position: fixed; right: 10px; bottom: calc(76px + var(--safe-bottom)); z-index: 7; pointer-events: none; padding: 3px 9px; border-radius: 999px; background: var(--warn); color: var(--ink); font-size: .6875rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; opacity: .85; }
body.has-minibar .devmark { bottom: calc(124px + var(--safe-bottom)); }
.minibar.late .mb-when { color: var(--warn); }


/* Timeline: the day as a column, so gaps and clashes have a shape */
.view-toggle { display: flex; gap: 8px; padding: 0 14px 10px; }
.view-toggle button {
  flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font: inherit; font-size: .9375rem; font-weight: 700; cursor: pointer;
}
.view-toggle button[aria-pressed="true"] { background: var(--surface); color: var(--text); border-color: var(--gold); }
.tl-day { padding: 0 14px 22px; }
/* The hour gutter is in rem so Larger text widens it with its labels. */
.tl-grid { position: relative; margin-left: 3rem; }
.tl-hour { position: absolute; left: -3rem; right: 0; height: 0; border-top: 1px solid var(--line); }
.tl-hour span { position: absolute; left: 0; top: -8px; font-size: .75rem; color: var(--dim); white-space: nowrap; }
.tl-block {
  position: absolute; overflow: hidden; border-radius: 8px; cursor: pointer; text-align: left;
  background: var(--h); border: 0; padding: 5px 7px; color: var(--ink); font: inherit;
  display: grid; align-content: start; gap: 1px;
}
.tl-block .tb-title { font-size: .8125rem; font-weight: 700; line-height: 1.15; }
.tl-block .tb-room { font-size: .6875rem; font-weight: 600; opacity: .8; }
.tl-block .tb-runs { font-size: .6875rem; font-weight: 700; opacity: .7; }
/* A block is as tall as its event is long, so text that will not fit gives
   way in order, by measurement: the title drops to one line, then the room
   goes. Larger text made this matter for hour-long picks. */
.tl-block.tight .tb-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tl-block.tighter .tb-room { display: none; }
/* A six-hour block is 360px of flat colour. Keep its true position and
   height - the geometry is the point - but let the body fade toward the
   page so shorter picks still read as the foreground. */
.tl-block.long { border: 1px solid var(--h); }
.tl-block.long::after {
  content: ""; position: absolute; left: 0; right: 0; top: 54px; bottom: 0;
  background: linear-gradient(to bottom, transparent, var(--ink) 88%);
  opacity: .85; pointer-events: none;
}
.tl-now { position: absolute; left: -46px; right: 0; height: 0; border-top: 2px solid var(--warn); z-index: 3; }
.tl-now::after {
  content: "now"; position: absolute; left: 0; top: -8px; font-size: .6875rem; font-weight: 700;
  color: var(--warn); background: var(--ink); padding-right: 4px;
}
.tl-link { position: absolute; z-index: 2; pointer-events: none; border-left: 2px dashed var(--muted); }
.tl-link span {
  /* right-aligned: block titles run from the left, so a badge pinned right
     clears them even when two picks are back to back with no gap to sit in */
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%); white-space: nowrap;
  font-size: .6875rem; font-weight: 700; color: var(--muted);
  background: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
}
.tl-link.tight { border-left-color: var(--warn); }
.tl-link.tight span { color: var(--warn); }
</style>

<body>

<header class="hdr">
  <div class="hdr-text">
    <div class="brand" id="brand">Dragon Con 2026</div>
    <div class="hdr-line"><span class="clock" id="clock">…</span><span class="fresh" id="fresh"></span><button class="sim-chip" id="simChip" hidden aria-label="Simulated time. Tap to use the real clock">simulated time <span aria-hidden="true">&times;</span></button></div>
  </div>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <div id="notice" class="notice" hidden></div>
  <section class="view" id="view-now"></section>
  <section class="view" id="view-browse" hidden></section>
  <section class="view" id="view-explore" hidden></section>
  <section class="view" id="view-map" hidden></section>
  <section class="view" id="view-mine" hidden></section>
</main>

<button class="update-pill" id="updatePill" hidden>Schedule updated &middot; tap to refresh</button>

<button class="minibar" id="minibar" hidden></button>

<nav class="nav" aria-label="Sections">
  <button data-tab="now" aria-current="page">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now
  </button>
  <button data-tab="browse">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search
  </button>
  <button data-tab="explore">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Explore
  </button>
  <button data-tab="map">
    <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map
  </button>
  <button data-tab="mine" style="position:relative">
    <svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Mine
    <span class="badge" id="mineBadge" hidden>0</span>
  </button>
</nav>

<div id="sheetWrap" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle" id="sheet">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-panel" id="panel-settings">
    <h2 id="sheetTitle">Settings</h2>
    <label>Crowd factor for walk estimates: <b id="crowdLabel"></b>
      <input type="range" id="crowd" min="1" max="2.5" step="0.1">
    </label>
    <label class="toggle"><input type="checkbox" id="noiseDefault"> Hide photo sessions and video-room screenings by default</label>
    <label class="toggle"><input type="checkbox" id="bigText"> Larger text</label>
    <details class="advanced" id="advanced">
      <summary>Advanced</summary>
      <div class="advanced-body">
        <label>Preview a different time (leave blank to use the real clock)
          <input type="datetime-local" id="previewTime">
        </label>
        <div class="rowbtns">
          <button class="btn quiet" id="applyPreview">Apply preview time</button>
          <button class="btn quiet" id="clearPreview">Use real time</button>
        </div>
        <details>
          <summary style="color:var(--muted);cursor:pointer">Walk-time defaults (minutes, before crowd factor)</summary>
          <table class="walk-table" id="walkTable"></table>
        </details>
        <div class="device" id="deviceLine"></div>
      </div>
    </details>
    <div class="rowbtns">
      <button class="btn" id="closeSheet">Done</button>
    </div>
    <div class="rowbtns">
      <button class="btn danger" id="resetPicks">Remove all picks</button>
    </div>
    </div>
    <div class="sheet-panel" id="panel-event" hidden></div>
    <div class="sheet-panel" id="panel-hotel" hidden></div>
  </div>
</div>

/* ==================================================================

   clock, the Now tab, leave-by, the search folds, the nudge snooze, the
   ICS stamp - so one override moves all of them together. Elapsed-time
   measurements (a drag's speed, the scroll-spy hold, boot timings) are
   stopwatch reads and use performance.now() instead.

   ?now=2026-09-05T14:15 in the URL simulates that moment; an offset is
   honoured (2026-09-05T14:15:00-04:00). The override is kept for the tab's
   session, so a reload or the update pill lands on the same moment, and
   is cleared from Settings or the chip in the header. A simulated clock
   stands still: the tick redraws, but the minute never changes.

   live, ended - is a question about the clock.
   ================================================================== */
const CON = {
  year: 2026,
  /* The first listed event's start and the last one's end, as the data

  start: toDate("2026-09-02T18:00"),
  end: toDate("2026-09-07T19:00"),

const TIME_OVERRIDE_KEY = `dc26.timeOverride${BUILD.channel ? "." + BUILD.channel : ""}`;

const writeSession = (key, value) => { try { if (value === null) sessionStorage.removeItem(key); else sessionStorage.setItem(key, value); } catch (e) {} };

function now() { return timeOverride ? new Date(timeOverride.getTime()) : new Date(); }

/* The URL wins over the session, so a pasted link means what it says; with
   no ?now= the session's override, if any, carries on. */
function initTimeOverride() {
  const fromUrl = new URLSearchParams(location.search).get("now");
  const raw = fromUrl !== null ? fromUrl : readSession(TIME_OVERRIDE_KEY);
  timeOverride = parseMoment(raw);
  writeSession(TIME_OVERRIDE_KEY, timeOverride ? raw : null);
}
/* value: an ISO date-time, or null for the real clock. The URL is kept in
   step so a reload lands on the same moment - only "+" is encoded, so the
   address stays readable - and the hash (an explore deep link) is left
   alone. The day chips follow the clock again until tapped. */
function setTimeOverride(value) {
  timeOverride = parseMoment(value);
  writeSession(TIME_OVERRIDE_KEY, timeOverride ? value : null);
  const rest = location.search.replace(/^\?/, "").split("&").filter(p => p && !p.startsWith("now="));

}

/* before | live | ended. The bounds are the con's own: a moment at the very

function conPhase(at = now()) { return at < CON.start ? "before" : at > CON.end ? "ended" : "live"; }

/* ==================================================================
   Loading
   ================================================================== */
async function load() {
  let data = window.DC_EVENTS;
  if (!data) {
    try {
      const r = await fetch(DATA_URL, {cache: "no-cache"});
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
      fromNetwork = true;
    } catch (e) {
      /* Only reached with no worker at all: with one installed, a cached
         response resolves normally and the worker reports offline by message
         instead. This is the plain-browser, no-signal path. */
      try {
        const cached = await caches.match(DATA_URL, {ignoreSearch: true});
        if (cached) { data = await cached.json(); fromNetwork = false; }
      } catch (e2) { /* no Cache API: fall through to the empty state */ }
      if (!data) {
      document.getElementById("view-now").innerHTML =
        `<div class="empty"><b>No schedule data yet.</b><br>${DATA_URL} is missing or unreadable. Run <code>python scraper.py</code> in this folder, then reload.</div>`;
      return;
      }
    }
  }
  meta = data;
  events = (data.events || []).filter(e => e.start).map(e => {
    const s = toDate(e.start), en = e.end ? toDate(e.end) : new Date(s.getTime() + 60 * 60000);
    const people = (e.speakers || []).map(p => p.name).join(" ");
    const room = cleanRoom(e.hotel, e.room);
    /* _cd is the con day: it runs to 5am, so a 1am panel belongs to the night
       before. Every list, chip and header uses it; only the sheet and the
       calendar export state the calendar date. */
    return {...e, room, _s: s, _e: en, _cd: conDayKey(s), _people: people};
  });
  events.sort((a, b) => a._s - b._s || a.title.localeCompare(b.title));
  byId = new Map(events.map(e => [e.id, e]));
  tracks = [...new Set(events.map(e => e.track).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  hotels = HOTEL_ORDER.filter(h => events.some(e => e.hotel === h));
  hotelChips = [...new Set(hotels.map(hotelGroup))];
  servedOffline = fromNetwork === false;
  BOOT.parsed = performance.now();
  buildCatalogue();
  applyExploreHash();          // a pasted #explore= link lands on its page
  reconcilePicks();            // picks that vanished or moved since they were starred
  updateFresh();
  render();                    // the first screen, before any index exists
  BOOT.rendered = performance.now();
  BOOT.indexAtRender = !!index;
  scheduleIndexBuild();
}

/* The search index is the slowest step of boot - about two seconds for
   3,500 events on a laptop, longer on a phone - and the first screen does
   not need it. So the tab on screen draws first and the index follows in
   idle time; the suggestion index (people and fandoms, for the chips under
   the search box) after that. A query typed before the index exists is
   held, and runs the moment it can. */

function scheduleIndexBuild() {

    buildIndex();
    BOOT.indexed = performance.now();
    indexReady();
    idle(() => {
      buildSuggestIndex();

}
function indexReady() {
  const box = document.getElementById("q");
  if (box) { box.placeholder = SEARCH_PLACEHOLDER; box.classList.remove("indexing"); }

}

function buildIndex() {
  index = new MiniSearch({
    fields: ["title", "fandoms", "speakers", "aliases", "tracks", "kind", "topics", "description", "location"],
    storeFields: [], processTerm,
    /* Prefix matching on a two- or three-letter term is mostly noise - "ai"
       would reach every word starting "ai". Short terms must match exactly;
       the suggestion index keeps its own prefix rule and is unaffected. */
    searchOptions: {processTerm, prefix: t => t.length >= 4, fuzzy: t => t.length > 4 ? 0.2 : false, combineWith: "OR",
      boost: {title: 5, fandoms: 4, speakers: 3, aliases: 2, tracks: 2, kind: 2, topics: 2, description: 1, location: 1}},
  });
  index.addAll(events.map(e => {
    const tg = e.tags || {};
    const fandoms = (tg.fandoms || []).join(" "), topics = (tg.topics || []).join(" ");
    const kind = tg.kind ? `${tg.kind} ${KIND_LABELS[tg.kind] || ""}` : "";
    const text = [e.title, e.description, (e.tracks || []).join(" "), fandoms, topics, kind, e.location].join(" ").toLowerCase();
    return {id: e.id, title: e.title, description: e.description || "", speakers: e._people, tracks: (e.tracks || []).join(" "),
      fandoms, kind, topics, aliases: aliasesFor(e, text), location: e.location || ""};
  }));
}
/* A second, tiny index: one document per name, so we can suggest whole
   names rather than fragments of event text. */
let suggestIndex = null, suggestDocs = [];
function buildSuggestIndex() {
  /* Two counts per name. A celebrity's dozen entries are mostly photo
     sessions, which are hidden by default - a chip promising 12 that yields
     2 is worse than no number at all. */
  const people = new Map(), topics = new Map();
  const bump = (m, n, quiet) => {
    if (n.length <= 2) return;
    const c = m.get(n) || {all: 0, visible: 0};
    c.all++; if (!quiet) c.visible++;
    m.set(n, c);
  };
  events.forEach(e => {
    const quiet = isNoise(e);
    (e.speakers || []).forEach(p => bump(people, (p && p.name || "").trim(), quiet));
    const tg = e.tags || {};
    [...(tg.fandoms || []), ...(tg.topics || [])].forEach(t => bump(topics, String(t || "").trim(), quiet));
  });
  const doc = (group, prefix) => ([name, c]) => ({id: `${prefix}:${name}`, name, all: c.all, visible: c.visible, group});
  suggestDocs = [
    ...[...people].map(doc("people", "p")),
    ...[...topics].map(doc("topics", "t")),
  ];
  suggestIndex = new MiniSearch({
    fields: ["name"], storeFields: ["name", "all", "visible", "group"], processTerm,
    searchOptions: {processTerm, prefix: true, fuzzy: false, combineWith: "AND"},
  });
  suggestIndex.addAll(suggestDocs);
}

/* autoSuggest completes the words typed; each completion is then resolved
   back to whole names, because a chip saying "fillion" is no use. */
function suggestionsFor(raw) {
  const q = String(raw || "").trim();
  if (!suggestIndex || q.length < 2) return {people: [], topics: []};
  const seen = new Set(), hits = [];
  const take = res => res.forEach(r => { if (!seen.has(r.id)) { seen.add(r.id); hits.push(r); } });
  take(suggestIndex.search(q, {prefix: true, fuzzy: false, combineWith: "AND"}));
  for (const s of suggestIndex.autoSuggest(q, {fuzzy: false}).slice(0, 6)) {
    if (s.suggestion.toLowerCase() === q.toLowerCase()) continue;
    take(suggestIndex.search(s.suggestion, {prefix: true, fuzzy: false, combineWith: "AND"}));
  }
  const useVisible = state.browse.hideNoise;
  const n = h => useVisible ? h.visible : h.all;
  const pick = group => hits.filter(h => h.group === group && n(h) > 0)
    .sort((a, b) => n(b) - n(a) || a.name.localeCompare(b.name))
    .slice(0, 5)
    .map(h => ({name: h.name, count: n(h)}));
  const out = {people: pick("people"), topics: pick("topics")};
  /* Once the box already holds exactly one of these, the row is just noise. */
  const exact = n => n.toLowerCase() === q.replace(/^"|"$/g, "").toLowerCase();
  if (out.people.some(x => exact(x.name)) || out.topics.some(x => exact(x.name))) return {people: [], topics: []};
  return out;
}

function fandomCounts() {
  const m = new Map();
  events.forEach(e => (e.tags && e.tags.fandoms || []).forEach(f => m.set(f, (m.get(f) || 0) + 1)));
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function updateFresh() {
  const el = document.getElementById("fresh");
  if (!meta.generated_at) { el.textContent = ""; return; }
  /* After the con the copy is final; how long ago it was refreshed stops
     being the question. Under a simulated clock the copy can postdate the
     moment shown - "-1020 min ago" - so then it is named by when, not how
     long. */
  let fresh;
  if (conEnded()) fresh = `final<span class="word"> schedule</span>`;
  else {
    const at = toDate(meta.generated_at), ago = minutesBetween(at, now());
    const f = m => m < 60 ? `${m} min` : m < 48 * 60 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`;
    fresh = ago < 0 ? `<span class="word">refreshed </span>${DAY_LABEL[dayOf(at)] || ""} ${fmtShort(at)}`

/* Chip rows scroll sideways, and a render rebuilds them from scratch - which
   used to snap every row back to its left edge, so the chip just tapped at
   the far end vanished. Remember where each named row was and put it back. */
function chipRowsSnapshot() {
  const m = {};
  document.querySelectorAll(".chips[data-row]").forEach(el => { if (el.scrollLeft) m[el.dataset.row] = el.scrollLeft; });
  return m;
}
function chipRowsRestore(m) {
  document.querySelectorAll(".chips[data-row]").forEach(el => { if (m[el.dataset.row]) el.scrollLeft = m[el.dataset.row]; });
}
/* Bring one chip fully into its row: the one just tapped, or on Explore the

  const row = chip && chip.closest(".chips");

  let dx = 0;

  else if (r.right > R.right - pad) dx = r.right - R.right + pad;
  if (!dx) return;

  "Hyatt":           {x: 120, y: 222, w: 60, h: 56},
  "Marriott":        {x: 190, y: 222, w: 60, h: 56},
  "Hilton":          {x: 307, y: 222, w: 60, h: 56},
  "Courtland Grand": {x: 300, y: 347, w: 60, h: 56},
  "Hardy Ivy Park":  {x: 117, y: 124, w: 60, h: 24, park: true},

/* A gold pill on the block's top-right corner; none at all when zero. A

function mapPillSVG(hotel, b, n) {

/* What today's overlay is made of, computed once per render: the on-now and
   next picks, where the reader is, and the hero's leave-by. Null on any day
   but the one the clock is in. */
function mapNowState(day) {
  const at = now();
  if (day !== conDayKey(at)) return null;
  const model = nowModel(at), next = model.upcoming[0] || null, from = currentLocation(at);
  return {now: at, onNow: model.onNowEv, next, from, info: leaveInfo(from, next, at)};
}
/* A solid gold ring on the hotel of the pick that is on now, a pulsing one on

function mapRingsSVG(st) {
  if (!st) return "";
  const ring = (h, cls) => {
    const b = MAP_HOTELS[h];
    if (!b) return "";

    return `<rect class="map-ring ${cls}" data-hotel="${esc(h)}" x="${b.x - pad}" y="${b.y - pad}" width="${b.w + 2 * pad}" height="${b.h + 2 * pad}" rx="${(b.park ? 6 : 10) + pad}"/>`;

function mapCardHTML(cs) {
  if (conEnded()) return "";                 // nothing is next any more
  const {now, onNow, next, later, info} = cs;
  const onLine = onNow ? `<button class="next-on" data-hero="${esc(onNow.id)}">On now: <b>${esc(onNow.title)}</b> &middot; ends ${fmtShort(onNow._e)} &middot; ${esc(onNow.hotel === "Other" ? (onNow.room || "offsite") : hotelShort(onNow.hotel))}</button>` : "";

/* The day the map shows: the one tapped, else the con day the clock is in,

function mapDay() {
  if (state.map.day) return state.map.day;

}

function renderMap() {

  const chips = CON_DAYS.map(d => chipHTML(DAY_LABEL[d], day === d, "map-day", d)).join("");

/* The minute tick redraws only what changed. The SVG is redrawn when a ring

function renderMiniBar() {

    <div class="row-line">
      <button class="row-main" aria-haspopup="dialog">
        <div class="t">${opts.showDay ? `<span class="day">${DAY_LABEL[ev._cd] || ""}</span>` : ""}<span class="start">${s.t}<span class="ampm">${s.ap}</span></span><span class="end">to ${e.t} ${e.ap}</span></div>
        <div class="body">
          <div class="title">${hl(ev.title)}</div>
          <div class="meta">
            <span class="room" style="--h:var(${hotelVar(ev.hotel)})">${placeHTML(ev)}</span>
            ${ev.cancelled ? `<span class="cancelled-tag">Cancelled</span>` : ""}${status}${isCeleb(ev) ? CELEB_BADGE : ""}${(opts.labels || []).map(l => `<span class="flabel">${esc(l)}</span>`).join("")}<span class="track">${esc(ev.track || (ev.type === "gaming" ? "Gaming" : ""))}</span>
          </div>
          ${snippet ? `<div class="snippet">${snippet}</div>` : ""}
        </div>
      </button>
      <button class="star" aria-pressed="${mine}" aria-label="${mine ? "Remove from my schedule" : "Add to my schedule"}">${mine ? "★" : "☆"}</button>
    </div>
  </li>`;
}

function highlighter(terms) {
  const words = [...new Set(terms)].filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return x => esc(x);
  const re = new RegExp(`(${words.join("|")})`, "gi");
  return x => esc(x).replace(re, "<mark>$1</mark>");
}
function snippetFor(ev, terms) {
  const d = ev.description || "";
  const words = [...new Set(terms)].filter(t => t.length > 1);
  let pos = -1;
  for (const w of words) { const i = d.toLowerCase().indexOf(w); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
  if (pos < 0) {
    const who = (ev.speakers || []).map(p => p.name).join(", ");
    if (who && words.some(w => who.toLowerCase().includes(w))) return `With ${highlighter(terms)(who)}`;
    return d ? esc(d.slice(0, 110)) + (d.length > 110 ? "…" : "") : "";
  }
  const start = Math.max(0, pos - 40), end = Math.min(d.length, pos + 100);
  return (start > 0 ? "…" : "") + highlighter(terms)(d.slice(start, end)) + (end < d.length ? "…" : "");
}

function gapHTML(prev, next) {
  if (!prev || !next || prev._cd !== next._cd && minutesBetween(prev._e, next._s) > 240) return "";
  const gap = minutesBetween(prev._e, next._s);
  const walk = walkMin(prev.hotel, next.hotel);
  const move = prev.hotel !== next.hotel ? `${hotelShort(prev.hotel)} to ${hotelShort(next.hotel)}` : `same building`;
  if (next._s < prev._e) {
    const ov = minutesBetween(next._s, prev._e);
    return `<div class="gap overlap">Overlaps the one above by ${ov} min</div>`;
  }
  if (gap < walk) return `<div class="gap tight">${gap} min to get there, ${move} is about ${walk} min at con pace</div>`;
  if (gap < walk + 10) return `<div class="gap">${gap} min gap, ${move} about ${walk} min. Tight but doable</div>`;
  return "";
}

/* A con day runs to 5am, so a 1am Sunday panel still belongs to Saturday. */
function conDayKey(d) { return dayOf(new Date(d.getTime() - 5 * 3600000)); }

function nextPickInConDay(now) {
  const key = conDayKey(now);
  return events.find(e => picks.has(e.id) && e._s > now && conDayKey(e._s) === key) || null;
}

/* ---- Where you are, and when to leave ------------------------------ */

/* The only place the app will claim you are: the hotel of a pick that is
   on right now. Nothing is inferred from where you were - a pick that has
   ended says nothing about where you went next, and a stream that is on
   could be watched from anywhere. Null otherwise; we can still show a
   start time, just not a leave-by. */
function currentLocation(now) {
  const on = events.find(e => picks.has(e.id) && e._s <= now && now < e._e);
  return on && on.hotel !== "Streaming" ? on.hotel : null;
}

/* The pick before this one in the same con day, if any. */
function previousPick(next) {
  let prev = null;
  for (const e of events) {
    if (e._s >= next._s) break;
    if (picks.has(e.id) && e._cd === next._cd) prev = e;
  }
  return prev;
}

/* A leave-by only when we know where you are - a pick is on now - and the
   next pick is somewhere else. Otherwise the start time, plus a walk
   estimate from wherever the previous pick today was, when that was a
   different building: the walk at the crowd factor with no buffer, so it
   reads as an estimate ("~12 min from the Westin"), not an instruction. */
function leaveInfo(from, next, now) {
  if (!next) return null;
  if (from && from !== next.hotel) {
    const walk = walkMin(from, next.hotel);
    const leaveBy = new Date(next._s.getTime() - (walk + LEAVE_BUFFER_MIN) * 60000);
    return {from, walk, leaveBy, late: now >= leaveBy, next, estimate: null};
  }
  const prev = previousPick(next);
  const walk = prev && prev.hotel !== next.hotel ? walkMin(prev.hotel, next.hotel) : 0;
  const where = prev && (prev.hotel === "Other" ? (prev.room || "offsite") : hotelPhrase(prev.hotel));
  const estimate = walk > 0 ? {walk, from: prev.hotel, label: `~${walk} min from ${where}`} : null;
  return {from, walk: null, leaveBy: null, late: false, next, estimate};
}

const RING_R = 26, RING_C = 2 * Math.PI * RING_R;
function ringHTML(fraction, minutes, late) {
  const f = Math.max(0, Math.min(1, fraction));
  const label = minutes >= 60 ? `${Math.floor(minutes / 60)}h` : `${Math.max(0, minutes)}`;
  return `<div class="ring"><svg width="62" height="62" viewBox="0 0 62 62" aria-hidden="true">
      <circle class="track-c" cx="31" cy="31" r="${RING_R}" fill="none" stroke-width="5"></circle>
      <circle class="prog" cx="31" cy="31" r="${RING_R}" fill="none" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="${(RING_C * (1 - f)).toFixed(1)}"></circle>
    </svg><div class="num">${label}<small>${minutes >= 60 ? "" : "min"}</small></div></div>`;
}

function heroHTML(ev, now, onNow, thenNext) {
  const from = currentLocation(now);
  let kicker, leaveLine = "", thenLine = "", target, windowStart, late = false;

  if (onNow) {
    kicker = "On now";
    target = ev._e;
    windowStart = ev._s;
    const info = leaveInfo(from, thenNext, now);
    if (info && info.leaveBy) {
      /* The one case with a leave-by: we know where you are because you
         are in something. Say which building. */
      late = info.late;
      const here = ev.hotel === "Other" ? esc(ev.room || "here") : esc(hotelPhrase(ev.hotel));
      leaveLine = `<div class="hleave">${late ? `leave ${here} now` : `leave ${here} by ${fmtShort(info.leaveBy)}`}</div>`;
      thenLine = `<div class="hthen">then: <b>${esc(hotelShort(thenNext.hotel))}</b> at ${fmtShort(thenNext._s)}</div>`;
    } else {
      leaveLine = `<div class="hleave">ends ${fmtShort(ev._e)}</div>`;
      if (info) thenLine = `<div class="hthen">then: ${esc(hotelShort(thenNext.hotel))} next</div>`;
    }
  } else {
    /* Nothing is on, so nowhere is known: no leave-by. The ring counts to
       the start, and the walk from the previous pick is offered as an
       estimate, not an instruction. */
    kicker = "Your next";
    const info = leaveInfo(from, ev, now);
    target = ev._s;
    windowStart = new Date(ev._s.getTime() - 60 * 60000);
    leaveLine = `<div class="hleave">starts ${fmtShort(ev._s)}</div>`;
    thenLine = info && info.estimate ? `<div class="hthen hwalk">${esc(info.estimate.label)}</div>` : "";
  }
  const total = Math.max(1, minutesBetween(windowStart, target));
  const leftMin = minutesBetween(now, target);

  return `<button class="hero${late ? " late" : ""}" data-hero="${esc(ev.id)}">
    ${ringHTML(leftMin / total, leftMin, late)}
    <div class="hbody">
      <div class="hkicker">${kicker}</div>
      <div class="htitle">${esc(ev.title)}</div>
      <div class="hroom" style="--h:var(${hotelVar(ev.hotel)})">${placeHTML(ev)}</div>
      ${leaveLine}${thenLine}
    </div>
  </button>`;
}

/* ---- Now ---------------------------------------------------------- */
/* Before the con the Now tab previews a sensible moment instead of an empty
   one. Shared so the minute tick sees the same clock as the render. After
   the con the tab is the archive, and this is not consulted. */
function effectiveNow() {
  const real = now();
  if (conPhase(real) === "before") {
    return {now: toDate("2026-09-03T10:00"),
      banner: `<b>Con starts Thursday.</b> Showing Thursday 10:00 AM as a preview. Use Settings to preview any other time.`};
  }
  return {now: real, banner: ""};
}

/* ---- The notice above the views ------------------------------------ */
/* After the con: that it is over, on every tab, until dismissed - once,
   and remembered for that year. Before it: the preview banner. Live:
   nothing. */
const ARCHIVE_NOTICE_KEY = "dc26.archiveNoticeDismissed";
const archiveNoticeDismissed = () => loadJSON(ARCHIVE_NOTICE_KEY, null) === CON.year;
function noticeHTML() {
  if (conEnded()) {
    return archiveNoticeDismissed() ? "" : `<b>Dragon Con ${CON.year} has ended.</b> Your starred events are on the Now tab as your ${CON.year} schedule.
    <div class="btns"><button class="btn quiet" data-act="dismiss-archive">OK</button></div>`;
  }
  return effectiveNow().banner;
}
let lastNoticeHTML = null;
function renderNotice() {
  const html = noticeHTML();
  if (html === lastNoticeHTML) return;       // the tick calls this every minute
  lastNoticeHTML = html;
  const el = document.getElementById("notice");
  el.hidden = !html;
  el.className = conEnded() ? "notice archive" : "notice";
  el.innerHTML = html;
}

/* ---- The Now tab after the con ------------------------------------- */
/* The record: every starred event, by con day, in time order. Rows work
   as they do anywhere, so the list can still be tidied. */
const ARCHIVE_SIG = "archive";
function archiveHTML() {
  const mine = events.filter(e => picks.has(e.id));
  let html = pickNewsHTML() + `<div class="section-title">Your ${CON.year} schedule <span class="count">${mine.length}</span></div>`;
  if (!mine.length) return html + `<div class="empty"><b>Nothing starred.</b> Star things in Search and they'll be listed here by day.</div>`;
  html += `<ul class="list">`;
  let lastDay = "";
  mine.forEach(ev => {
    if (ev._cd !== lastDay) { html += `<li class="day-head">${DAY_LONG[ev._cd] || ev._cd}</li>`; lastDay = ev._cd; }
    html += rowHTML(ev, {list: "archive"});
  });
  return html + `</ul>`;
}

/* What the Now tab would show, without building any of it.
   The plan is today's - the con day, which runs to 5am - because "your next"
   and "leave by" are about the next few hours, and a Saturday pick seen from
   Thursday was being announced as starting at 2:30 PM with no day on it.
   Anything still running past 5am counts as today too. A pick on a later
   day gets one line naming the day, so the tab never looks empty when the
   plan is not. */
function nowModel(now) {
  const horizon = new Date(now.getTime() + 60 * 60000);
  const today = conDayKey(now);
  const future = events.filter(e => picks.has(e.id) && e._e > now);
  const minePlan = future.filter(e => conDayKey(e._s) === today || e._s <= now);
  const later = minePlan.length ? null : (future.find(e => conDayKey(e._s) > today) || null);
  const onNowEv = minePlan.find(e => e._s <= now && now < e._e) || null;
  const upcoming = minePlan.filter(e => e._s > now);
  const heroEv = minePlan.length ? (onNowEv || upcoming[0]) : null;
  const rest = heroEv ? minePlan.filter(e => e !== heroEv) : [];
  const around = events.filter(e => e._e > now && e._s <= horizon
    && !(state.browse.hideNoise && isNoise(e))
    && hotelMatches(e, state.now.hotel));
  return {minePlan, later, onNowEv, upcoming, heroEv, rest, around, shown: around.slice(0, state.now.limit)};
}

const statusShown = (ev, now) => ev._s <= now || minutesBetween(now, ev._s) <= 90;

/* Everything that decides which elements exist. The clock is deliberately
   absent: a new minute changes the words, not the structure. */
function nowSignature(m, now, banner) {
  return [
    banner,
    m.heroEv ? m.heroEv.id : "-",
    m.later ? m.later.id : "-",
    pickNews.length,
    nudgeVisible() ? "nudge" : "-",
    m.onNowEv ? "on" : "next",
    m.rest.map(e => e.id + (statusShown(e, now) ? "!" : "")).join(","),
    m.around.length,
    m.shown.map(e => (e._s <= now ? "o" : "u") + e.id).join(","),
  ].join("|");
}
let lastNowSig = null;

function renderNow() {
  if (conEnded()) { lastNowSig = ARCHIVE_SIG; document.getElementById("view-now").innerHTML = archiveHTML(); return; }
  const {now, banner} = effectiveNow();
  const model = nowModel(now);
  lastNowSig = nowSignature(model, now, banner);
  const minePlan = model.minePlan;
  let mineHTML = nudgeHTML() + pickNewsHTML();
  if (minePlan.length) {
    const onNowEv = model.onNowEv, upcoming = model.upcoming, heroEv = model.heroEv;
    const thenNext = onNowEv ? upcoming[0] : null;
    mineHTML += heroHTML(heroEv, now, !!onNowEv, thenNext);
    const rest = model.rest;
    if (rest.length) {
      mineHTML += `<div class="section-title">Rest of your day <span class="count">${minePlan.length} today</span></div><ul class="list compact">`;
      rest.forEach((ev, i) => {
        const status = ev._s <= now ? `On now, ends ${fmtShort(ev._e)}` : `In ${minutesBetween(now, ev._s)} min`;
        mineHTML += gapHTML(i === 0 ? heroEv : rest[i - 1], ev) + rowHTML(ev, {list: "next", status: minutesBetween(now, ev._s) <= 90 || ev._s <= now ? status : ""});
      });
      mineHTML += `</ul>`;
    }
  } else if (model.later) {
    const day = DAY_LONG[conDayKey(model.later._s)] || model.later.day;
    mineHTML += `<div class="empty"><b>Nothing picked for later today.</b> Your next pick is on ${day}.</div>
      <ul class="list compact">${rowHTML(model.later, {list: "next", showDay: true})}</ul>`;
  } else {
    mineHTML += `<div class="empty"><b>Nothing picked for later today.</b> Star things in Search and they show up here with walk times.</div>`;
  }

  const around = model.around, shown = model.shown;
  let aroundHTML = `<div class="section-title">On now and in the next hour <span class="count">${around.length}</span></div>
    <div class="controls" style="padding-top:0"><div class="chips" data-row="now-hotel">${chipHTML("All", state.now.hotel === "All", "now-hotel")}${hotelChips.map(h => chipHTML(hotelShort(h), state.now.hotel === h, "now-hotel", h)).join("")}</div></div><ul class="list compact">`;
  let lastKey = "";
  shown.forEach(ev => {
    const key = ev._s <= now ? "on" : fmtShort(ev._s);
    if (key !== lastKey) { aroundHTML += `<li class="time-head">${key === "on" ? "On now" : "Starts " + key}</li>`; lastKey = key; }
    aroundHTML += rowHTML(ev, {list: "around"});
  });
  aroundHTML += `</ul>`;
  if (around.length > shown.length) aroundHTML += `<button class="btn quiet more" data-act="more-now">Show ${around.length - shown.length} more</button>`;
  if (!around.length) aroundHTML += `<div class="empty">Nothing on in this window${state.now.hotel !== "All" ? " at the " + hotelShort(state.now.hotel) : ""}.</div>`;
  document.getElementById("view-now").innerHTML = mineHTML + aroundHTML;
}

/* Two rows of chips under the box: who, and what. */
function suggestHTML() {
  const q = state.browse.q.trim();
  const active = /^".+"$/.test(q) ? q.slice(1, -1) : null;
  if (active) {
    return `<div class="chips suggest-row"><button class="chip suggest on" data-act="unsuggest"
      aria-pressed="true" aria-label="Clear ${esc(active)}">${esc(active)} <span aria-hidden="true">&times;</span></button></div>`;
  }
  const s = suggestionsFor(q);
  if (!s.people.length && !s.topics.length) return "";
  const row = (label, items) => items.length
    ? `<div class="chips suggest-row"><span class="suggest-label">${label}</span>${items.map(i =>
        `<button class="chip suggest" data-act="suggest" data-name="${esc(i.name)}">${esc(i.name)} <span class="n">${i.count}</span></button>`).join("")}</div>`
    : "";
  return row("People", s.people) + row("Fandoms &amp; topics", s.topics);
}

/* When nothing matched a word literally, every result is a guess at what was
   meant - "drag" only reaches "dragons" by prefix. Ranking cannot fix that,
   but pretending to be confident about it is the part that misleads. */
function noExactMatchHTML(results) {
  if (!state.browse.q.trim() || !results.length) return "";
  const ranked = results.filter(e => e._hit);
  if (!ranked.length || ranked.some(e => e._hit.exact)) return "";
  const raw = (state.browse.parsed && state.browse.parsed.residual) || "";
  const shown = (/^".+"$/.test(raw) ? raw.slice(1, -1) : raw).trim();
  if (!shown) return "";
  /* A prefix and a typo are different failures and deserve different words:
     "philharmonic" does not start with "philharmonc". */
  const typed = shown.toLowerCase().split(/[\s\p{P}]+/u).map(processTerm).filter(Boolean);
  const byPrefix = ranked.some(e => (e._hit.terms || []).some(m => typed.some(t => m.startsWith(t) && m !== t)));
  const how = byPrefix ? "showing words that start with it" : "showing close spellings";
  return `<div class="no-exact">No exact match for <b>${esc(shown)}</b> &mdash; ${how}.</div>`;
}

/* Searching a person by name and quietly dropping their photo sessions is
   the wrong default when the name is the whole query - say what was held
   back and offer it, rather than hiding it twice. */
function hiddenForQueryHTML(results) {
  const b = state.browse;
  if (!b.q.trim() || b.showHidden || !b.hideNoise) return "";
  const raw = (b.parsed && b.parsed.residual) || "";
  const name = /^".+"$/.test(raw) ? raw.slice(1, -1) : raw.trim();
  if (!name) return "";
  /* Only for a person: a bare word like "photo" is already handled by the
     kind override, and we don't want this line on every search. */
  const isPerson = suggestDocs.some(d => d.group === "people" && d.name.toLowerCase() === name.toLowerCase());
  if (!isPerson) return "";
  const lower = name.toLowerCase();
  const shown = new Set(results.map(e => e.id));
  const hidden = events.filter(e => isNoise(e) && !shown.has(e.id)
    && (e.speakers || []).some(p => (p.name || "").toLowerCase() === lower));
  if (!hidden.length) return "";
  const word = hidden.length === 1 ? "session" : "sessions";
  return `<div class="hidden-note">${hidden.length} photo ${word} hidden &middot; <button data-act="show-hidden">show</button></div>`;
}

/* Show what the query was read as, and let the reader take it back off. */
function parsedChipsHTML() {
  const chips = (state.browse.parsed && state.browse.parsed.chips) || [];
  const today = state.browse.todayScoped
    ? `<button class="chip parsed" data-act="unparse-today" aria-label="Show the whole con instead of today">Today <span aria-hidden="true">&times;</span></button>`
    : "";
  if (!chips.length && !today) return "";
  return `<div class="chips parsed-chips" aria-label="Filters read from your search">${today}${chips.map(c =>
    `<button class="chip parsed" data-act="unparse" data-src="${esc(c.src)}" aria-label="Remove ${esc(c.label)} filter">${esc(c.label)} <span aria-hidden="true">&times;</span></button>`).join("")}</div>`;
}

function chipHTML(label, on, kind, value, style) {
  const v = value ?? label;
  const cls = kind.endsWith("hotel") && v !== "All" ? `chip hotel` : `chip`;
  const st = kind.endsWith("hotel") && v !== "All" ? ` style="--h:var(${hotelVar(v)})"` : "";
  return `<button class="${cls}" data-chip="${kind}" data-value="${esc(v)}" aria-pressed="${on}"${st}>${esc(label)}</button>`;
}

/* ---- Browse ------------------------------------------------------- */
function passesFilters(e) {
  const f = activeFilters(), tg = e.tags || {};
  return (f.day === "All" || e._cd === f.day) &&
    hotelMatches(e, f.hotel) &&
    (f.type === "All" || e.type === f.type) &&
    (f.track === "All" || (e.tracks || []).includes(f.track)) &&
    (f.fandom === "All" || (tg.fandoms || []).includes(f.fandom)) &&
    (f.kind === "All" || tg.kind === f.kind) &&
    (!f.adultOnly || !!tg.adult) &&
    (!f.hideAdult || !tg.adult) &&
    (!f.time || inTimeBand(e, f.time)) &&
    (!f.hideNoise || !isNoise(e));
}
/* ==================================================================
   Query intent: "star trek saturday hilton" is three different asks.
   Pull the filter words out, search on what's left, and show what we
   took so the reader can put it back.
   ================================================================== */
const DAY_WORDS = {wed: 2, wednesday: 2, thu: 3, thur: 3, thurs: 3, thursday: 3, fri: 4, friday: 4,
  sat: 5, saturday: 5, sun: 6, sunday: 6, mon: 7, monday: 7};
const HOTEL_WORDS = {marriott: "Marriott", hyatt: "Hyatt", hilton: "Hilton", westin: "Westin",
  courtland: "Courtland Grand", sheraton: "Courtland Grand", mart: "AmericasMart", americasmart: "AmericasMart"};
const TIME_BANDS = {morning: [0, 12], afternoon: [12, 17], evening: [17, 21], "late night": [21, 29], late: [21, 29]};

/* Longest phrases first so "photo op" wins over "photo" and "late night"
   over "late". Each entry knows how to label itself and what text to strip. */
function queryRules() {
  const r = [];
  const add = (word, dim, value, label) => r.push({word, dim, value, label});
  Object.entries(DAY_WORDS).forEach(([w, dayNum]) => add(w, "day", `2026-09-0${dayNum}`, DAY_LONG[`2026-09-0${dayNum}`]));
  Object.entries(HOTEL_WORDS).forEach(([w, h]) => add(w, "hotel", h, hotelShort(h)));
  add("q&a", "kind", "qa", "Celebrity Q&A"); add("qa", "kind", "qa", "Celebrity Q&A");
  add("signing", "kind", "signing", "Signing");
  add("photo op", "kind", "photo", "Photo op"); add("photo", "kind", "photo", "Photo op");
  add("screening", "kind", "screening", "Screening");
  add("workshop", "kind", "workshop", "Workshop");
  add("party", "kind", "party", "Party");
  add("contest", "kind", "contest", "Contest");
  add("concert", "kind", "performance", "Performance"); add("performance", "kind", "performance", "Performance");
  add("gaming", "kind", "gaming", "Gaming"); add("game", "kind", "gaming", "Gaming");
  add("18+", "adult", true, "18+"); add("adult", "adult", true, "18+");
  /* Someone searching "kids" wants the Kids Track, not merely the absence of
     adult content - hiding 18+ is the lesser half of what they mean. */
  ["kids", "kid", "family", "children"].forEach(w => add(w, "kidstrack", true, "Kids Track"));
  Object.keys(TIME_BANDS).forEach(w => add(w, "time", w, w[0].toUpperCase() + w.slice(1)));
  add("today", "rel", "today", "Today");
  add("tonight", "rel", "tonight", "Tonight");
  add("tomorrow", "rel", "tomorrow", "Tomorrow");
  return r.sort((a, b) => b.word.length - a.word.length);
}
let QUERY_RULES = null;

/* Token matching, not regular expressions: the vocabulary contains "q&a"
   and "18+", and building patterns out of those invites escaping bugs. */
/* "d&d" survives tokenising as one token and matches nothing; the index
   holds "dungeons" and "dragons" as separate terms. Expand before searching
   so the shorthand people actually type reaches the words that were indexed. */
const QUERY_EXPANSIONS = [
  [/\bd\s*&\s*d\b/gi, "dungeons dragons"],
  [/\bdnd\b/gi, "dungeons dragons"],
  [/\bdungeons\b(?!\s+(?:and|&)?\s*dragons\b)/gi, "dungeons dragons"],
];
function expandQuery(text) {
  let out = String(text || "");
  for (const [re, to] of QUERY_EXPANSIONS) out = out.replace(re, to);
  return out.replace(/\s+/g, " ").trim();
}

function tokenise(text) { return String(text || "").toLowerCase().split(/[\s,]+/).filter(Boolean); }
function stripPhrase(tokens, phrase) {
  const want = phrase.split(" ");
  for (let i = 0; i + want.length <= tokens.length; i++) {
    if (want.every((w, j) => tokens[i + j] === w)) return tokens.slice(0, i).concat(tokens.slice(i + want.length));
  }
  return null;
}

function parseQuery(raw) {
  if (!QUERY_RULES) QUERY_RULES = queryRules();
  let tokens = tokenise(raw);
  const found = [], taken = new Set();
  for (const rule of QUERY_RULES) {
    if (taken.has(rule.dim) && rule.dim !== "rel") continue;
    const after = stripPhrase(tokens, rule.word);
    if (!after) continue;
    tokens = after;
    taken.add(rule.dim);
    found.push({...rule, src: rule.word});
  }
  const residual = tokens.join(" ");

  /* "gaming" alone is a filter; "gaming" inside a real query is a search
     word, unless a day or hotel is pinning it down. */
  const gi = found.findIndex(f => f.dim === "kind" && f.value === "gaming");
  if (gi >= 0 && residual && !found.some(f => f.dim === "day" || f.dim === "hotel" || f.dim === "rel")) {
    found.splice(gi, 1);
    /* Re-strip from the original so the word goes back where it was written,
       rather than being tacked on the end. */
    let keep = tokenise(raw);
    for (const f of found) { const a = stripPhrase(keep, f.word); if (a) keep = a; }
    return finishParse(keep.join(" "), found);
  }
  return finishParse(residual, found);
}

function finishParse(residual, found) {
  const filters = {};
  const chips = [];
  for (const f of found) {
    if (f.dim === "rel") {
      const base = conDayKey(now());
      let day = base;
      if (f.value === "tomorrow") {
        const d = new Date(`${base}T12:00`); d.setDate(d.getDate() + 1); day = dayOf(d);
      }
      filters.day = day;
      if (f.value === "tonight") filters.time = "evening";
      chips.push({dim: "day", label: f.label, src: f.src});
    } else if (f.dim === "kidstrack") {
      filters.track = "Kids Track";
      filters.adult = false;
      chips.push({dim: "track", label: f.label, src: f.src});
    } else {
      filters[f.dim] = f.value;
      chips.push({dim: f.dim, label: f.label, src: f.src});
    }

  return {residual, filters, chips};
}

function inTimeBand(e, band) {
  const [lo, hi] = TIME_BANDS[band] || [];
  if (lo === undefined) return true;
  let h = e._s.getHours();
  if (h < 5) h += 24;                    // a 1am panel belongs to the night before
  return h >= lo && h < hi;
}

/* Chip filters still apply; a parsed word overrides the chip on its own
   dimension for as long as the word is in the box. */
function activeFilters() {
  const b = state.browse, f = (state.browse.parsed && state.browse.parsed.filters) || {};
  return {
    day: f.day !== undefined ? f.day : b.day,
    hotel: f.hotel !== undefined ? f.hotel : b.hotel,
    kind: f.kind !== undefined ? f.kind : b.kind,
    type: b.type,
    track: f.track !== undefined ? f.track : b.track,
    fandom: b.fandom,
    adultOnly: f.adult === true,
    /* Only a query word hides 18+ now ("kids"); the checkbox is gone. */
    hideAdult: f.adult === false,
    time: f.time,
    /* Asking for photo sessions or screenings outranks the setting that hides
       them; so does tapping their chip, and so does the reveal link. */
    hideNoise: b.hideNoise && !state.browse.showHidden
      && !["photo", "screening"].includes(f.kind !== undefined ? f.kind : b.kind),
